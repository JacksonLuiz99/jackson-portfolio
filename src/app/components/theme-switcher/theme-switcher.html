<div role="group" [attr.aria-label]="i18n.t('nav.theme')">
  @if (fullWidth()) {
    <span class="mb-2 block font-mono text-xs text-muted">{{ i18n.t('nav.theme') }}</span>
  }
  <div class="flex gap-1.5" [class.w-full]="fullWidth()">
    @for (option of options; track option.value) {
      <button
        type="button"
        (click)="theme.setTheme(option.value)"
        [attr.aria-label]="i18n.t(option.labelKey)"
        [attr.aria-pressed]="theme.current() === option.value"
        [attr.title]="i18n.t(option.labelKey)"
        [attr.data-theme-option]="option.value"
        [class.flex-1]="fullWidth()"
        [class.border-border]="theme.current() !== option.value"
        [class.border-accent]="theme.current() === option.value"
        [class.bg-surface]="theme.current() !== option.value"
        [class.bg-surface-2]="theme.current() === option.value"
        class="inline-flex items-center justify-center gap-2 rounded-lg border px-2 py-1.5 transition-colors hover:border-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent/30"
      >
        <span
          aria-hidden="true"
          class="size-5 shrink-0 rounded-full border border-border"
          [style.background]="option.preview"
        ></span>
        @if (fullWidth()) {
          <span class="font-mono text-xs text-text">{{ i18n.t(option.labelKey) }}</span>
        }
      </button>
    }
  </div>
</div>
